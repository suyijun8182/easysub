name: Build and Publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 默认 GITHUB_TOKEN 没有 packages 写权限，推送到 GHCR 会被拒（denied），
    # 导致 Build and push 步骤失败。这里显式授予 packages:write。
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            suyijun8182/easysub:latest
            suyijun8182/easysub:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/easysub:latest
            ghcr.io/${{ github.repository_owner }}/easysub:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 把 DOCKERHUB.md 同步到 Docker Hub 仓库的 Overview（full_description）。
  # 独立成 job：失败不影响镜像发布。只在 main 推送时跑（tag 推送内容相同，避免重复请求）。
  # 用社区维护的 peter-evans/dockerhub-description：此前内联 curl 走 /v2/users/login + JWT，
  # Docker Hub 认证方式变更后一直失败（与 token 权限无关）。DOCKERHUB_TOKEN 需 Read, Write, Delete。
  dockerhub-overview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync Docker Hub overview (DOCKERHUB.md)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: suyijun8182/easysub
          readme-filepath: ./DOCKERHUB.md
          short-description: "Self-hosted subscription & renewal manager, 14 notify channels. 自托管订阅续费保号管理."
